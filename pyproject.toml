[project]
name = "microagent"
version = "0.1.0"
description = "Provider-neutral, industrial-grade lightweight Agent framework. Core + addon ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "microagent" }]
dependencies = [
    "pydantic>=2.10, <3",
    "typing-extensions>=4.12, <5",
]
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
openai = ["openai>=1.60.0, <3"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
mcp = ["mcp>=1.0.0"]
docstring = ["griffelib>=2"]

[dependency-groups]
dev = [
  "mypy",
  "ruff>=0.9.0",
  "pytest",
  "pytest-asyncio",
  "pyright>=1.1.400",
  "coverage>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microagent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
isort = { combine-as-imports = true, known-first-party = ["microagent"] }

[tool.mypy]
strict = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
